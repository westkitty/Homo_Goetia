  <circle cx="50" cy="85" r="3" fill="#ff5a79" />
  <circle cx="22" cy="35" r="3" fill="#ff5a79" />
  <circle cx="78" cy="35" r="3" fill="#ff5a79" />
  <circle cx="22" cy="65" r="3" fill="#ff5a79" />
  <circle cx="78" cy="65" r="3" fill="#ff5a79" />
</svg>
